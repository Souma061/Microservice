<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micro Video</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d0f12; color: #e6e8eb;
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid #1e232a;
    position: sticky; top: 0; background: #0d0f12; z-index: 2;
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  h1 span { color: #6ea8fe; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .status { margin-left: auto; font-size: 12px; color: #8b93a1; }
  .status b { color: #6ea8fe; font-weight: 600; }

  form {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: #14181e; border: 1px solid #1e232a;
    border-radius: 10px; padding: 14px; margin-bottom: 24px;
  }
  input, button {
    font: inherit; border-radius: 7px; border: 1px solid #2a313b;
    background: #0f1216; color: inherit; padding: 8px 12px;
  }
  input[type=text] { flex: 1; min-width: 180px; }
  input[type=file] { max-width: 260px; }
  button {
    background: #2563eb; border-color: #2563eb; cursor: pointer;
    font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: #8b93a1; width: 100%; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card {
    background: #14181e; border: 1px solid #1e232a; border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: border-color .15s;
  }
  .card:hover { border-color: #2563eb; }
  .card video { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
  .card .meta { padding: 10px 12px; }
  .card .title { font-weight: 600; font-size: 14px; }
  .card .sub { font-size: 12px; color: #8b93a1; margin-top: 2px; }
  .empty { color: #8b93a1; text-align: center; padding: 60px 0; }

  dialog {
    border: 1px solid #2a313b; background: #14181e; color: inherit;
    border-radius: 12px; padding: 0; max-width: 860px; width: 92%;
  }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  dialog video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
  dialog .bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
  dialog .bar strong { font-size: 15px; }
  dialog .bar button { margin-left: auto; background: #1e232a; border-color: #2a313b; }
</style>
</head>
<body>
<header>
  <h1>MICRO<span>VIDEO</span></h1>
  <div class="status">API <b id="api">…</b> · DB <b id="db">…</b> · ready <b id="count">0</b></div>
</header>

<main>
  <form id="form">
    <input type="text" id="title" placeholder="Title" maxlength="200" />
    <input type="file" id="file" accept="video/*" required />
    <button type="submit" id="go">Upload</button>
    <div class="hint">202 → job queued → worker picks it up → appears below when ready. Stop the worker and this page keeps working.</div>
  </form>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No videos yet.</div>
</main>

<dialog id="dlg">
  <video id="player" controls autoplay></video>
  <div class="bar"><strong id="dlgTitle"></strong><button id="close">Close</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (t) => new Date(t).toLocaleTimeString();

async function get(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}

function card(v) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <video src="${v.url}" preload="metadata" muted></video>
    <div class="meta">
      <div class="title"></div>
      <div class="sub">${fmt(v.createdAt)}</div>
    </div>`;
  el.querySelector('.title').textContent = v.title;
  el.onclick = () => {
    $('player').src = v.url;
    $('dlgTitle').textContent = v.title;
    $('dlg').showModal();
  };
  return el;
}

async function refreshFeed() {
  const list = await get('/feed');
  $('count').textContent = list.length;
  $('empty').style.display = list.length ? 'none' : 'block';

  const grid = $('grid');
  const stale = new Map([...grid.children].map((el) => [el.dataset.id, el]));

  for (const v of list) {
    let el = stale.get(v.id);
    if (el) stale.delete(v.id);
    else { el = card(v); el.dataset.id = v.id; }
    grid.appendChild(el); // reorders in place, never rebuilds
  }
  for (const el of stale.values()) el.remove();
}

async function refreshHealth() {
  const ok = async (u) => (await fetch(u)).ok;
  $('api').textContent = (await ok('/health')) ? 'up' : 'down';
  $('db').textContent = (await ok('/health/ready')) ? 'up' : 'down';
}

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const file = $('file').files[0];
  if (!file) return;
  $('go').disabled = true;
  try {
    const fd = new FormData();
    fd.append('title', $('title').value || file.name);
    fd.append('file', file, file.name);
    const r = await fetch('/videos', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    const { videoId, status } = await r.json();
    $('title').value = '';
    $('file').value = '';
    console.log('queued', videoId, status);
  } catch (err) {
    alert('Upload failed: ' + err.message);
  } finally {
    $('go').disabled = false;
  }
};

$('close').onclick = () => { $('player').pause(); $('dlg').close(); };

refreshFeed();
refreshHealth();
setInterval(refreshFeed, 1500);
setInterval(refreshHealth, 3000);
</script>
</body>
</html>
