<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micro Links</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d0f12; color: #e6e8eb;
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid #1e232a;
    position: sticky; top: 0; background: #0d0f12; z-index: 2;
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  h1 span { color: #6ea8fe; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .status { margin-left: auto; font-size: 12px; color: #8b93a1; }
  .status b { color: #6ea8fe; font-weight: 600; }

  form {
    display: flex; gap: 10px; align-items: center;
    background: #14181e; border: 1px solid #1e232a;
    border-radius: 10px; padding: 14px; margin-bottom: 18px;
  }
  input, button {
    font: inherit; border-radius: 7px; border: 1px solid #2a313b;
    background: #0f1216; color: inherit; padding: 8px 12px;
  }
  input[type=url] { flex: 1; min-width: 220px; }
  button {
    background: #2563eb; border-color: #2563eb; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: #8b93a1; }
  .error { color: #f87171; font-size: 13px; margin-bottom: 12px; display: none; }

  .created {
    display: none; align-items: center; gap: 10px;
    background: #10231a; border: 1px solid #1c5137;
    border-radius: 10px; padding: 12px 14px; margin-bottom: 18px;
  }
  .created code { color: #4ade80; font-size: 15px; }
  .created a { color: #6ea8fe; text-decoration: none; }
  .created button { background: #1e232a; border-color: #2a313b; font-weight: 400; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #1e232a; }
  th { color: #8b93a1; font-weight: 500; font-size: 12px; text-transform: uppercase; }
  tr:hover td { background: #14181e; }
  td a.code { color: #6ea8fe; text-decoration: none; font-family: ui-monospace, monospace; }
  td.url { color: #8b93a1; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.count { font-variant-numeric: tabular-nums; text-align: right; }
  td.when { color: #8b93a1; font-size: 12px; white-space: nowrap; }
  .empty { color: #8b93a1; text-align: center; padding: 50px 0; }
</style>
</head>
<body>
<header>
  <h1>MICRO<span>LINKS</span></h1>
  <div class="status">API <b id="api">…</b> · DB <b id="db">…</b> · links <b id="count">0</b></div>
</header>

<main>
  <form id="form">
    <input type="url" id="url" placeholder="https://example.com/a/very/long/url" required />
    <button type="submit" id="go">Shorten</button>
    <span class="hint">201 → short code · GET /:code → 302 + click logged + job queued</span>
  </form>

  <div class="error" id="error"></div>

  <div class="created" id="created">
    <span>created</span>
    <code id="shortCode"></code>
    <a id="shortLink" target="_blank" rel="noopener"></a>
    <button type="button" id="copy">copy</button>
  </div>

  <table>
    <thead>
      <tr><th>Short</th><th>Destination</th><th style="text-align:right">Clicks</th><th>Created</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty">No links yet — shorten one above.</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const when = (t) => new Date(t).toLocaleString();

async function get(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
}

function row(link) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><a class="code" target="_blank" rel="noopener"></a></td>
    <td class="url"></td>
    <td class="count"></td>
    <td class="when"></td>`;
  const a = tr.querySelector('a.code');
  a.textContent = link.short;
  a.href = link.short;
  tr.querySelector('.url').textContent = link.url;
  tr.querySelector('.url').title = link.url;
  tr.querySelector('.count').textContent = link.clickCount;
  tr.querySelector('.when').textContent = when(link.createdAt);
  return tr;
}

async function refreshLinks() {
  const list = await get('/links');
  $('count').textContent = list.length;
  $('empty').style.display = list.length ? 'none' : 'block';

  const body = $('rows');
  const stale = new Map([...body.children].map((tr) => [tr.dataset.code, tr]));

  for (const link of list) {
    let tr = stale.get(link.code);
    if (tr) {
      stale.delete(link.code);
      tr.querySelector('.count').textContent = link.clickCount;
    } else {
      tr = row(link);
      tr.dataset.code = link.code;
    }
    body.appendChild(tr); // reorders in place, never rebuilds
  }
  for (const tr of stale.values()) tr.remove();
}

async function refreshHealth() {
  const ok = async (u) => (await fetch(u)).ok;
  $('api').textContent = (await ok('/health')) ? 'up' : 'down';
  $('db').textContent = (await ok('/health/ready')) ? 'up' : 'down';
}

$('form').onsubmit = async (e) => {
  e.preventDefault();
  $('error').style.display = 'none';
  $('go').disabled = true;
  try {
    const link = await get('/links', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url: $('url').value }),
    });
    $('url').value = '';
    $('shortCode').textContent = link.code;
    $('shortLink').href = link.short;
    $('shortLink').textContent = location.origin + link.short;
    $('created').style.display = 'flex';
    await refreshLinks();
  } catch (err) {
    $('error').textContent = err.message;
    $('error').style.display = 'block';
  } finally {
    $('go').disabled = false;
  }
};

$('copy').onclick = () => navigator.clipboard.writeText(location.origin + $('shortLink').getAttribute('href'));

refreshLinks();
refreshHealth();
setInterval(refreshLinks, 1500);
setInterval(refreshHealth, 3000);
</script>
</body>
</html>
